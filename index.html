<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheet Fetch Test</title>
<style>
  body { font-family: -apple-system, monospace; padding: 16px; background:#111; color:#eee; font-size:14px; }
  #out { white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
  .ok { color: #4caf6e; }
  .err { color: #ff6b6b; }
  .warn { color: #e8c46a; }
</style>
</head>
<body>
<h3>Google Sheet Fetch Test</h3>
<div id="out">Starting…</div>
<script>
  var out = document.getElementById('out');
  function log(msg, cls) {
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = msg;
    out.appendChild(line);
  }

  var SHEET_API_URL = "https://script.google.com/macros/s/AKfycby_E8jEwAQg9H6peB_dhSMqRQtdGZM08gJWi6X3dOgArcbnW_KfjhHqSQg6u9hDgzeexg/exec";
  var callbackName = "__testCallback_" + Math.random().toString(36).slice(2, 8);
  log("Callback name: " + callbackName);

  var startTime = Date.now();
  var finished = false;

  var timeout = setTimeout(function () {
    if (finished) return;
    finished = true;
    log("RESULT: TIMEOUT after 10s — the script tag never called back.", "err");
    log("This usually means the request was blocked before it could load (ad blocker, security extension, or network filter), or Google returned something that could not run as JavaScript.", "warn");
  }, 10000);

  window[callbackName] = function (data) {
    if (finished) return;
    finished = true;
    clearTimeout(timeout);
    var ms = Date.now() - startTime;
    log("RESULT: SUCCESS in " + ms + "ms — got " + data.length + " rows.", "ok");
    log("First row: " + JSON.stringify(data[0]));
  };

  var script = document.createElement("script");
  script.src = SHEET_API_URL + "?callback=" + callbackName;
  log("Requesting: " + script.src);

  script.onload = function () {
    log("script.onload fired (the network request completed).");
  };
  script.onerror = function () {
    if (finished) return;
    finished = true;
    clearTimeout(timeout);
    log("RESULT: script.onerror FIRED — the browser blocked or failed to load this URL as a script.", "err");
  };

  document.body.appendChild(script);
  log("Script tag added to page, waiting for response…");
</script>
</body>
</html>
